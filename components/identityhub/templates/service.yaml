apiVersion: v1
kind: Service
metadata:
  name: {{ template "app.chartname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.service.http.port }}
    targetPort: {{ .Values.service.http.port }}
  - name: identity
    port: {{ .Values.service.identity.port }}
    targetPort: {{ .Values.service.identity.port }}
  - name: credentials
    port: {{ .Values.service.credentials.port }}
    targetPort: {{ .Values.service.credentials.port }}
  - name: did
    port: {{ .Values.service.did.port }}
    targetPort: {{ .Values.service.did.port }}
  - name: sts
    port: {{ .Values.service.sts.port }}
    targetPort: {{ .Values.service.sts.port }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}