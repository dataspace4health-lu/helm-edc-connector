apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.chartname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ include "app.revision" . }}
    app.kubernetes.io/part-of: rse
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      securityContext:
{{- include "app.securitycontext" . | nindent 8 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      {{- end }}
      containers:
      - name: {{ template "app.chartname" . }}
        image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}

        env:
          - name: EDC_SQL_SCHEMA_AUTOCREATE
            value: "{{ .Values.config.sqlSchemaAutocreate | default "true" }}"
          - name: EDC_IH_IAM_ID
            value: "{{ .Values.config.identityHubIamId }}"
          - name: EDC_IH_IAM_PUBLICKEY_ALIAS
            value: "{{ .Values.config.identityHubIamPublicKeyAlias }}"
          - name: WEB_HTTP_PORT
            value: "{{ .Values.config.http.port }}"
          - name: WEB_HTTP_PATH
            value: "{{ .Values.config.http.path }}"
          - name: WEB_HTTP_IDENTITY_PORT
            value: "{{ .Values.config.identity.port }}"
          - name: WEB_HTTP_IDENTITY_PATH
            value: "{{ .Values.config.identity.path }}"
          - name: WEB_HTTP_IDENTITY_AUTH_KEY
            value: "{{ .Values.config.identity.authKey }}"
          - name: WEB_HTTP_CREDENTIALS_PORT
            value: "{{ .Values.config.credentials.port }}"
          - name: WEB_HTTP_CREDENTIALS_PATH
            value: "{{ .Values.config.credentials.path }}"
          - name: WEB_HTTP_DID_PORT
            value: "{{ .Values.config.did.port }}"
          - name: WEB_HTTP_DID_PATH
            value: "{{ .Values.config.did.path }}"
        {{- if .Values.secretEnv }}
        {{- range $key, $value := .Values.secretEnv }}
          - name: "{{ $key }}"
            valueFrom:
              secretKeyRef:
                name: "{{ $value.name }}"
                key: "{{ $value.key }}"
        {{- end }}
        {{- end }}
        {{- if .Values.postgresql.enabled }}
          - name: EDC_DATASOURCE_DEFAULT_URL
            value: jdbc:postgresql://{{ include "app.chartname" . }}-postgresql-hl.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}
        {{- else }}
          - name: EDC_DATASOURCE_DEFAULT_URL
            value: {{ .Values.postgresql.url }}
        {{- end }}
          - name: EDC_DATASOURCE_DEFAULT_USER
            value: {{ .Values.postgresql.auth.username }}
{{- if .Values.extraVars }}
{{ toYaml .Values.extraVars | indent 10 }}
{{- end }}
        ports:
        {{- if .Values.metrics.enabled }}
          - name: monitoring
            containerPort: {{ .Values.metrics.port }}
        {{- end }}
          - name: http
            containerPort: {{ .Values.config.http.port }}
          - name: identity
            containerPort: {{ .Values.config.identity.port }}
          - name: credentials
            containerPort: {{ .Values.config.credentials.port }}
          - name: did
            containerPort: {{ .Values.config.did.port }}
        resources:
{{ toYaml .Values.resources | indent 10 }}

        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.readinessProbe.port }}
          initialDelaySeconds: 5
          periodSeconds: 5