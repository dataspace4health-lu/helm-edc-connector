{{- if and .Values.config.vault.createSecret (not (lookup "v1" "Secret" .Release.Namespace .Values.config.vault.tokenSecretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.config.vault.tokenSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.config.vault.token | quote }}
{{- end }}
