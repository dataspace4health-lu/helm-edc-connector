# -- Default number of instances to start 
replicaCount: 1
name: identityhub
# -- Ovverwrites application name
# nameOverride: ""

image:
  repository: ds4h-registry:5432
  name: edc-identityhub
  tag: "0.0.0"
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

## Port configuration for the Identity Hub services
service:
  http:
    port: 8181
  identity:
    port: 8182
  credentials:
    port: 8183
  did:
    port: 8184
  sts:
    port: 8185

config:
  sqlSchemaAutocreate: true
  identityHubIamId: "default"
  identityHubIamPublicKeyAlias: "default-key"
  http:
    host: ""
    port: 8181
    path: "/edc/ih/base/api"
  identity:
    host: ""
    port: 8182
    path: "/edc/ih/identity/api"
    authKey: "password"
  credentials:
    host: ""
    port: 8183
    path: "/edc/ih/credentials/api"
  did:
    host: ""
    port: 8184
    path: "/edc/ih/did/api"
  sts:
    host: ""
    port: 8185
    path: "/edc/ih/sts/api"

ingress:
  enabled: true
  hosts:
    - host: dataspace4health.local
      paths:
        - path: /edc/ih/identity/api
          port: 8182 ## identity api port
          pathType: Prefix
        - path: /edc/ih/credentials/api
          port: 8183 ## credentials api port
          pathType: Prefix
        - path: /edc/ih/did/api
          port: 8184 ## did port
          pathType: Prefix
        - path: /edc/ih/sts/api
          port: 8185 ## sts port
          pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local

## the health check end point
readinessProbe:
  enabled: true
  path: /edc/ih/base/api/check/health
  port: 8181

secretEnv:

postgresql:
  enabled: true
  image:
    registry: bitnamilegacy
    repository: postgresql
    tag: 16.2.0-debian-12-r8
  auth:
    username: identityhub_user
    password: "p@ssw0rd"
    database: identityhub_db
    postgresPassword: "p@ssw0rd"
  primary:
    persistence:
      enabled: true
      size: 5Gi
      path: "/data/identityhub-postgres"
