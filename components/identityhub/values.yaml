# -- Default number of instances to start 
replicaCount: 1
name: identityhub
# -- Ovverwrites application name
# nameOverride: ""

image:
  repository: ds4h-registry:5432
  name: edc-identityhub
  tag: latest
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
  - name: WEB_HTTP_PORT
    value: "8181"
  - name: WEB_HTTP_PATH
    value: "/api"
  - name: WEB_HTTP_IDENTITY_PORT
    value: "8182"
  - name: WEB_HTTP_IDENTITY_PATH
    value: "/api/identity"
  - name: WEB_HTTP_IDENTITY_AUTH_KEY
    value: "password"
  - name: WEB_HTTP_CREDENTIALS_PORT
    value: "8183"
  - name: WEB_HTTP_CREDENTIALS_PATH
    value: "/api/credentials"
  - name: WEB_HTTP_DID_PORT
    value: "8184"
  - name: WEB_HTTP_DID_PATH
    value: "/"
  - name: EDC_SQL_SCHEMA_AUTOCREATE
    value: "true"
  - name: EDC_IH_IAM_ID
    value: "default"
  - name: EDC_IH_IAM_PUBLICKEY_ALIAS
    value: "default-key"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

## Port configuration for the Identity Hub services
service:
  api:
    port: 8181
  identity:
    port: 8182
  credentials:
    port: 8183
  did:
    port: 8184

config:
  environment: development
  api:
    basePath: /api
  http:
    host: ""
    port: 8181
    timeout:
      idle: 120s
      read: 10s
      write: 10s
  identity:
    host: ""
    port: 8182
  credentials:
    host: ""
    port: 8183
  did:
    host: ""
    port: 8184

redis:
  enabled: false

ingress:
  enabled: true
  hosts:
    - host: dataspace4health.local
      paths:
        - path: /identity
          port: 8182 ## identity api port
          pathType: Prefix
        - path: /credentials
          port: 8183 ## credentials api port
          pathType: Prefix
        - path: /did
          port: 8184 ## did port
          pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local
  rewriteTargets:
    - regex: ^/identity/(.*)
      replacement: /api/identity/$1 # identity api path
    - regex: ^/credentials/(.*)
      replacement: /api/credentials/$1 # credentials api path
    - regex: ^/did/(.*)
      replacement: /$1 # did path

## the health check end point
readinessProbe:
  enabled: true
  path: /api/check/health
  port: 8181

secretEnv:

postgresql:
  enabled: true
  image:
    registry: bitnamilegacy
    repository: postgresql
    tag: 16.2.0-debian-12-r8
  auth:
    username: identityhub_user
    password: "p@ssw0rd"
    database: identityhub_db
    postgresPassword: "p@ssw0rd"
  primary:
    persistence:
      enabled: true
      size: 5Gi
      path: "/data/identityhub-postgres"