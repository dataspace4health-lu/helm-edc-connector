apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "app.chartname" . }}-appconfig
data:
  APP_BASE_HREF.txt: |
    {{ trimSuffix "/" .Values.config.http.path | default "/" }}
  app-config.json: |
    {
      "healthCheckIntervalSeconds": 30,
      "enableUserConfig": false,
      {{- if .Values.logoUrl }}
      "logoUrl": "{{ .Values.logoUrl }}",
      "logoAlt": "{{ .Values.logoAlt | default "Logo" }}",
      {{- end }}
      {{- if .Values.fontFamily }}
      "fontFamily": "{{ .Values.fontFamily }}",
      {{- end }}
      {{- if .Values.footerText }}
      "footerText": "{{ tpl .Values.footerText . }}",
      {{- end }}
      {{- $tc := dict }}
      {{- if .Values.themeColors.primary }}{{- $_ := set $tc "primary" .Values.themeColors.primary }}{{- end }}
      {{- if .Values.themeColors.secondary }}{{- $_ := set $tc "secondary" .Values.themeColors.secondary }}{{- end }}
      {{- if .Values.themeColors.accent }}{{- $_ := set $tc "accent" .Values.themeColors.accent }}{{- end }}
      {{- if .Values.themeColors.navbar }}{{- $_ := set $tc "navbar" .Values.themeColors.navbar }}{{- end }}
      {{- if .Values.themeColors.sidebar }}{{- $_ := set $tc "sidebar" .Values.themeColors.sidebar }}{{- end }}
      {{- if $tc }}
      "themeColors": {{ $tc | toJson }},
      {{- end }}
      {{- if .Values.keycloak.enabled }}
      "keycloak": {
        "enabled": true,
        "url": "{{ .Values.keycloak.url }}",
        "realm": "{{ .Values.keycloak.realm }}",
        "clientId": "{{ .Values.keycloak.clientId }}"
      },
      {{- end }}
      {{- $menuItems := list }}
      {{- if not (eq .Values.menuItems.home.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Home" "materialSymbol" "home_app_logo" "routerPath" "home" "divider" true) }}
      {{- end }}
      {{- if not (eq .Values.menuItems.catalog.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Catalog" "materialSymbol" "book_ribbon" "routerPath" "catalog" "viewDescription" "In the catalog view you can browse datasets of other connectors. For each dataset you can run contract negotiations to consume the data afterwards. If the selected connector has a federated catalog, the available datasets of other participants will be displayed automatically. Otherwise, you can request the catalog of other connectors configured in the dashboard. At any time you can request the catalog of unknown connectors by requesting it manually.") }}
      {{- end }}
      {{- if not (eq .Values.menuItems.assets.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Assets" "materialSymbol" "deployed_code_update" "routerPath" "assets" "viewDescription" "The asset view allows you to create, edit and delete the assets (datasets) in your connector. An asset represents any data that can be shared, for example static files, streaming data or API access. The dashboard only allows you to create assets with data types that your data plane(s) support.") }}
      {{- end }}
      {{- if not (eq .Values.menuItems.policyDefinitions.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Policy Definitions" "materialSymbol" "policy" "routerPath" "policies" "viewDescription" "The policy definitions view allows you to create, edit and delete policies. Policies are a generic way of defining a set of duties, rights, or obligations. EDC and DSP express policies with ODRL.") }}
      {{- end }}
      {{- if not (eq .Values.menuItems.contractDefinitions.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Contract Definitions" "materialSymbol" "contract_edit" "routerPath" "contract-definitions" "viewDescription" "The contract definitions view allows you to create, edit and delete contract definitions. Contract definitions link assets and policies by declaring which policies apply to a set of assets. Contract definitions contain two types of policies: an access policy (who can see or discover the data contract offer) and a contract policy (the actual terms and conditions of data use once a contract has been agreed upon)." "divider" true) }}
      {{- end }}
      {{- if not (eq .Values.menuItems.contracts.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Contracts" "materialSymbol" "handshake" "routerPath" "contracts" "viewDescription" "The contract view allows you to browse all contract negotiations that have been finished with an agreement. You can switch between providing and consuming contracts of the selected connector. For consuming contracts a transfer process can be started to receive the asset.") }}
      {{- end }}
      {{- if not (eq .Values.menuItems.transferHistory.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Transfer History" "materialSymbol" "schedule_send" "routerPath" "transfer-history" "viewDescription" "The transfer history view lets you browse and deprovision finished and ongoing transfer processes. You can switch between providing and consuming transfer processes of the selected connector.") }}
      {{- end }}
      {{- if not (eq .Values.menuItems.verifiableCredentials.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Verifiable Credentials" "materialSymbol" "verified" "routerPath" "verifiable-credentials" "viewDescription" "The Verifiable Credentials view allows you to manage your connector's Verifiable Credential. You can submit a new Verifiable Credential JSON or delete the existing one. Only one Verifiable Credential can be active at a time.") }}
      {{- end }}
      {{- if not (eq .Values.menuItems.participants.enabled false) }}
      {{-   $menuItems = append $menuItems (dict "text" "Participants" "materialSymbol" "group" "routerPath" "participants" "viewDescription" "The Participants view allows you to register and manage participants in the federated catalog. Each participant is identified by a DID and exposes a DSP endpoint for catalog crawling.") }}
      {{- end }}
      "menuItems": {{ $menuItems | toJson }}
    }
  edc-connector-config.json: |
    [
      {
        "connectorName": "{{ .Values.config.connectorName }}",
        "managementUrl": "{{ .Values.config.managementUrl }}",
        "defaultUrl": "{{ .Values.config.defaultUrl }}",
        "protocolUrl": "{{ .Values.config.protocolUrl }}",
        "federatedCatalogEnabled": {{ .Values.config.federatedCatalogEnabled }},
        "federatedCatalogUrl": "{{ .Values.config.federatedCatalogUrl }}",
        "did": "{{ .Values.config.did }}",
        "identityApiUrl": "{{ .Values.config.identityApiUrl }}",
        "negotiationEnabled": {{ .Values.config.negotiationEnabled | default true }}
      }
    ]
