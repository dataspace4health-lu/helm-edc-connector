{{- if and .Values.ingress.enabled ((.Values.ingress.rootRedirect).enabled) }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ template "app.chartname" . }}-redirect-root
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  redirectRegex:
    regex: ^(https?://[^/]+)/?$
    replacement: ${1}{{ .Values.ingress.rootRedirect.targetPath }}
    permanent: {{ .Values.ingress.rootRedirect.permanent | default true }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "app.chartname" . }}-redirect-root
  namespace: {{ .Release.Namespace }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ template "app.chartname" . }}-redirect-root@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
  rules:
  {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: {{ template "app.chartname" $ }}
                port:
                  number: {{ (index .paths 0).port }}
  {{- end }}
{{- end }}
