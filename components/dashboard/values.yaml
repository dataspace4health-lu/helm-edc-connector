replicaCount: 1
name: dashboard

image:
  repository: ds4h-registry:5432
  name: edc-dashboard
  tag: latest
  sha: ""
  pullPolicy: Always
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
       
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

## The web http ports is general-purpose API endpoint that may expose different resources and can be used when we write custom logic which is not part of management API or protocol API
## The management port is used to expose the management API of EDC
service:
  http:
    port: 8086

config:
  environment: development
  basePath: /dashboard
  http:
    host: ""
    port: 8080 #web http port
  # The connector config changes as per the connector type (data provider or data user)
  # For Data Provider
  connectorName: "Data Holder"
  managementUrl: "https://dataspace4health.local/edc-cp" # should point to control plane management api
  defaultUrl: "https://dataspace4health.local/api" # should point to api
  protocolUrl: "https://dataspace4health.local/edc-dsp" # should point to control plane dsp api
  federatedCatalogEnabled: "false"
  federatedCatalogUrl: "https://dataspace4health.local:8081/edc-fc/api/catalog" # should point to the federator's federated catalog api
  did: "did:web:dataspace4health%3A8093"
  # # For Data User
  # connectorName: "Data User"
  # managementUrl: "https://dataspace4health.local:8080/edc-cp" # should point to control plane management api
  # defaultUrl: "https://dataspace4health.local:8080/api" # should point to api
  # protocolUrl: "https://dataspace4health.local:8080/edc-dsp" # should point to control plane dsp api
  # federatedCatalogEnabled: "false"
  # federatedCatalogUrl: "https://dataspace4health.local:8081/edc-fc/api/catalog" # should point to the federator's federated catalog api
  # did: "did:web:dataspace4health%3A7093"

ingress:
  enabled: true
  rewriteTargets: 
  - regex: /dashboard(/|$)(.*)
    replacement: /$2
  rewriteBody: 
  - regex: <meta charset="utf-8">
    replacement: <base href="/dashboard/"><meta charset="utf-8">
    logLevel: -2
    monitoring:
      methods:
      - GET
      types:
      - "*/*"
      - text/html
  hosts:
    - host: dataspace4health.local
      paths:
      - path: /dashboard
        port: 8086 
        pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local

## the health check end point
readinessProbe:
  enabled: true
  path: /dashboard/
  port: 8080

secretEnv:

controlplane:
  enabled: true
  nameOverride: controlplane
  postgresql:
    nameOverride: controlplane-postgresql
