replicaCount: 1
name: dashboard

image:
  repository: ds4h-registry:5432
  name: edc-dashboard
  tag: "0.0.0"
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
       
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: true
  # -- User used by the apps
  runAsUid:
  # -- Group used by the apps
  runAsGid:
  # -- Optional pod fsGroup. Leave unset on runtimes that reject setgroups.
  # fsGroup:
  # -- Optional user-namespace toggle. Only set when the cluster explicitly supports it.
  # hostUsers: false

## The web http ports is general-purpose API endpoint that may expose different resources and can be used when we write custom logic which is not part of management API or protocol API
## The management port is used to expose the management API of EDC
service:
  http:
    port: 8086

config:
  http:
    host: ""
    port: 8080 #web http port
    path: /edc/dashboard
  # The connector config changes as per the connector type (data provider or data user)
  # For Data Provider
  connectorName: "Data Holder"
  managementUrl: "https://dataspace4health.local/edc/cp/management/api" # should point to control plane management api
  defaultUrl: "https://dataspace4health.local/edc/cp/base/api" # should point to api
  protocolUrl: "https://dataspace4health.local/edc/cp/dsp/api" # should point to control plane dsp api
  federatedCatalogEnabled: "false"
  federatedCatalogUrl: "https://dataspace4health.local/edc/cp/catalog/api" # should point to the federator's federated catalog api
  did: "did:web:dataspace4health.local"
  # Base URL of the IdentityHub credentials API for Verifiable Credential import.
  # Points to the credentials HTTP context (WEB_HTTP_CREDENTIALS_PATH, port 8183).
  # No auth header required — the vc-import extension handles vault lookup and upstream auth.
  identityApiUrl: "https://dataspace4health.local/edc/ih/credentials/api"
  # # For Data User
  # connectorName: "Data User"
  # managementUrl: "https://dataspace4health.local/edc/cp/management/api" # should point to control plane management api
  # defaultUrl: "https://dataspace4health.local/edc/cp/base/api" # should point to api
  # protocolUrl: "https://dataspace4health.local/edc/cp/dsp/api" # should point to control plane dsp api
  # federatedCatalogEnabled: "false"
  # federatedCatalogUrl: "https://dataspace4health.local/edc/cp/catalog/api" # should point to the federator's federated catalog api
  # did: "did:web:dataspace4health.local"
  # identityApiUrl: "https://dataspace4health.local/edc/ih/credentials/api"

## Keycloak authentication (optional)
## When enabled, the dashboard will redirect unauthenticated users to Keycloak for login.
keycloak:
  # -- Enable Keycloak authentication
  enabled: false
  # -- Keycloak server URL (e.g. https://keycloak.example.com)
  url: "https://dataspace4health.local/iam"
  # -- Keycloak realm name
  realm: "dca-metadata-capture-local"
  # -- Keycloak client ID (must be a public client with PKCE enabled)
  clientId: "edc-dashboard"

## Keycloak realm import (optional)
## When enabled, a post-install/post-upgrade Job will import the dca-metadata-capture-local realm
## into the Keycloak instance deployed by helm-edc-mdc/dca-metadata-capture.
keycloakImport:
  # -- Enable the realm import Job
  enabled: false
  # -- Create the ConfigMap containing the realm JSON (set to false if managed externally)
  createRealmConfigMap: true
  # -- Internal Kubernetes URL of the Keycloak service (from helm-edc-mdc)
  ## Adjust the namespace to match where helm-edc-mdc is deployed (e.g. default or dca-metadata-capture)
  keycloakInternalUrl: "http://dca-metadata-capture-keycloak.default.svc.cluster.local:80/iam"
  # -- Keycloak admin username
  adminUser: "admin"
  # -- Name of the Secret containing the Keycloak admin password
  adminPasswordSecretName: "dca-metadata-capture-keycloak"
  # -- Key inside the Secret for the admin password
  adminPasswordSecretKey: "admin-password"
  # -- Keycloak image tag used by the import Job (must match the deployed Keycloak version)
  image:
    tag: "26.3.3-debian-12-r0"

## Simple color theming (optional)
themeColors:
  # Primary color for buttons and main actions (hex format: #1976d2)
  primary: ""
  # Secondary color for secondary elements (hex format: #dc004e)  
  secondary: ""
  # Accent color for highlights and special elements (hex format: #00796b)
  accent: ""
  # Background color for the top navbar (hex format)
  navbar: ""
  # Background color for the left sidebar menu (hex format)
  sidebar: ""

## Branding (optional)
# URL to the participant's logo shown in the navbar (external URL or base64 data URI)
logoUrl: ""
# Alt text for the logo
logoAlt: "Logo"
# Font family applied across the dashboard (e.g. "Roboto, sans-serif")
fontFamily: ""
# Footer text shown at the bottom of the dashboard (e.g. "© 2025 Acme Corp. All rights reserved.")
footerText: ""

## Menu item visibility (optional)
## Set enabled: false for any item you want to hide from the sidebar navigation.
## All items are shown by default. Omitting a key also keeps the item visible.
menuItems:
  home:
    enabled: true
  catalog:
    enabled: true
  assets:
    enabled: true
  policyDefinitions:
    enabled: true
  contractDefinitions:
    enabled: true
  contracts:
    enabled: true
  transferHistory:
    enabled: true
  verifiableCredentials:
    enabled: true
  # Participants tab — disabled for connectors (only applicable to the federator)
  participants:
    enabled: false

ingress:
  enabled: true
  rootRedirect:
    # -- Redirect http(s)://dataspace4health.local/ to /edc/dashboard automatically
    enabled: true
    targetPath: /edc/dashboard
    permanent: true
  rewriteTargets: 
  - regex: /edc/dashboard(/|$)(.*)
    replacement: /$2
  rewriteBody: 
  - regex: <meta charset="utf-8">
    replacement: <base href="/edc/dashboard/"><meta charset="utf-8">
    logLevel: -2
    monitoring:
      methods:
      - GET
      types:
      - "*/*"
      - text/html
  hosts:
    - host: dataspace4health.local
      paths:
      - path: /edc/dashboard
        port: 8086 
        pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local

## the health check end point
readinessProbe:
  enabled: true
  path: /edc/dashboard/
  port: 8080

secretEnv:

controlplane:
  enabled: true
  nameOverride: controlplane
  postgresql:
    nameOverride: controlplane-postgresql
