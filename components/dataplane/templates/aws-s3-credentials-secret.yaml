{{- $seedConfig := .Values.config.vault.seedAwsSecret -}}
{{- $secretConfig := $seedConfig.credentials.secret -}}
{{- $secretName := $secretConfig.name | default (printf "%s-aws-s3-credentials" (include "app.chartname" .)) -}}
{{- if and $seedConfig.enabled $secretConfig.create }}
{{- $inlineAccessKeyId := $seedConfig.credentials.inline.accessKeyId | default "" -}}
{{- $inlineSecretAccessKey := $seedConfig.credentials.inline.secretAccessKey | default "" -}}
{{- /* Allow empty credentials — the secret is created with empty values so the chart deploys without S3 keys.
     Vault seeding can be done manually later via: kubectl exec <vault-pod> -- vault kv put secret/aws-cred content='{...}' */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $secretConfig.accessKeyIdKey }}: {{ $inlineAccessKeyId | quote }}
  {{ $secretConfig.secretAccessKeyKey }}: {{ $seedConfig.credentials.inline.secretAccessKey | quote }}
  {{ $secretConfig.sessionTokenKey }}: {{ $seedConfig.credentials.inline.sessionToken | quote }}
  {{ $secretConfig.expirationKey }}: {{ $seedConfig.credentials.inline.expiration | quote }}
{{- end }}
