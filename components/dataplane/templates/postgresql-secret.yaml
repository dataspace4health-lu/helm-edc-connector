{{- if not .Values.controlplane.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.chartname" . }}-controlplane-postgresql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.controlplane.postgresql.auth.password | quote }}
  postgres-password: {{ .Values.controlplane.postgresql.auth.postgresPassword | quote }}
{{- end }}