# deployment for data plane(an EDC component)
#TODO: setup dependency on control plane to be ready first
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.chartname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ include "app.revision" . }}
    app.kubernetes.io/part-of: rse
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      securityContext:
{{- include "app.securitycontext" . | nindent 8 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      {{- end }}
      
      initContainers:
        - name: wait-for-controlplane
          image: appropriate/curl:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Waiting for control plane to be ready... {{ .Values.config.controlplaneReadinessUrl }}"
              until curl -s {{ .Values.config.controlplaneReadinessUrl }} | grep -q "\"isSystemHealthy\":true"; do
                echo "Control plane is not ready yet. Retrying in 3 seconds..."
                sleep 3
              done
              echo "Control plane is ready!"

      containers:
      - name: {{ template "app.chartname" . }}
        image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        securityContext:
          readOnlyRootFilesystem: true
        env:
          - name: EDC_PARTICIPANT_ID 
            value: "{{ .Values.config.participantId }}"
          - name: EDC_SQL_SCHEMA_AUTOCREATE
            value: "{{ .Values.config.sqlSchemaAutocreate | default "true" }}"
          - name: EDC_DATA_PLANE_SELF_REGISTRATION
            value: "{{ .Values.config.dataplaneSelfRegistration }}"
          # should point to the control plane service name and control api port
          - name: EDC_DPF_SELECTOR_URL
            value: "{{ .Values.config.dataplaneSelectorUrl }}"
          - name: WEB_HTTP_PORT
            value: "{{ .Values.config.http.port }}"
          - name: WEB_HTTP_PATH
            value: "{{ .Values.config.http.path }}"
          - name: WEB_HTTP_CONTROL_PORT
            value: "{{ .Values.config.control.port }}"
          - name: WEB_HTTP_CONTROL_PATH
            value: "{{ .Values.config.control.path }}"
          - name: WEB_HTTP_MANAGEMENT_PORT
            value: "{{ .Values.config.management.port }}"
          - name: WEB_HTTP_MANAGEMENT_PATH
            value: "{{ .Values.config.management.path }}"
          - name: WEB_HTTP_PROTOCOL_PORT
            value: "{{ .Values.config.protocol.port }}"
          - name: WEB_HTTP_PROTOCOL_PATH
            value: "{{ .Values.config.protocol.path }}"
          - name: WEB_HTTP_VERSION_PORT
            value: "{{ .Values.config.version.port }}"
          - name: WEB_HTTP_VERSION_PATH
            value: "{{ .Values.config.version.path }}"
          - name: WEB_HTTP_PUBLIC_PORT
            value: "{{ .Values.config.public.port }}"
          - name: WEB_HTTP_PUBLIC_PATH
            value: "{{ .Values.config.public.path }}"
          - name: EDC_DATAPLANE_PROXY_PUBLIC_ENDPOINT
            value: "http://localhost:{{ .Values.config.public.port }}{{ .Values.config.public.path }}"
          - name: EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS
            value: "{{ .Values.config.participantId }}#{{ .Values.config.stsPublicKeyAlias }}"
          - name: EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS
            value: "{{ .Values.config.participantId }}-{{ .Values.config.stsPrivateKeyAlias }}"
          - name: EDC_VAULT_HASHICORP_URL
            value: "{{ .Values.config.vault.url }}"
        {{- if .Values.config.vault.tokenSecretName }}
          - name: EDC_VAULT_HASHICORP_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.config.vault.tokenSecretName }}
                key: {{ .Values.config.vault.tokenSecretKey }}
        {{- end }}
          - name: LOG_LEVEL
            value: "{{ .Values.log.level | default "INFO" }}"
        {{- if .Values.secretEnv }}
        {{- range $key, $value := .Values.secretEnv }}
          - name: "{{ $key }}"
            valueFrom:
              secretKeyRef:
                name: "{{ $value.name }}"
                key: "{{ $value.key }}"
        {{- end }}
        {{- end }}
          - name: EDC_DATASOURCE_DEFAULT_URL
            value: {{ .Values.controlplane.postgresql.url }}
          - name: EDC_DATASOURCE_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "app.chartname" . }}-controlplane-postgresql
                key: password
          - name: EDC_DATASOURCE_DEFAULT_USER
            value: {{ .Values.controlplane.postgresql.auth.username }}
{{- if .Values.extraVars }}
{{ toYaml .Values.extraVars | indent 10 }}
{{- end }}
        ports:
        {{- if .Values.metrics.enabled }}
          - name: monitoring
            containerPort: {{ .Values.metrics.port }}
        {{- end }}
          - name: control
            containerPort: {{ .Values.config.control.port }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
      {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.readinessProbe.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        {{- end }}


