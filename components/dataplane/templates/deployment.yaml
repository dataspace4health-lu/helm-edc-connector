# deployment for data plane(an EDC component)
#TODO: setup dependency on control plane to be ready first
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.chartname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ include "app.revision" . }}
    app.kubernetes.io/part-of: rse
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      securityContext:
{{- include "app.securitycontext" . | nindent 8 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      {{- end }}
      
      initContainers:
        - name: wait-for-controlplane
          image: appropriate/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - "/bin/sh"
            - "-c"
            - |
              echo "Waiting for control plane to be ready... http://{{ .Release.Name }}-controlplane:8181/api/check/health"
              until curl -s http://{{ .Release.Name }}-controlplane:8181/api/check/health | grep -q "\"isSystemHealthy\":true"; do
                echo "Control plane is not ready yet. Retrying in 3 seconds..."
                sleep 3
              done
              echo "Control plane is ready!"

      containers:
      - name: {{ template "app.chartname" . }}
        image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}

        env:
        {{- if .Values.secretEnv }}
        {{- range $key, $value := .Values.secretEnv }}
          - name: "{{ $key }}"
            valueFrom:
              secretKeyRef:
                name: "{{ $value.name }}"
                key: "{{ $value.key }}"
        {{- end }}
        {{- end }}
          - name: EDC_DATASOURCE_DEFAULT_URL
            value: {{ .Values.controlplane.postgresql.url }}
          - name: EDC_DATASOURCE_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "app.chartname" . }}-controlplane-postgresql
                key: password
          - name: EDC_DATASOURCE_DEFAULT_USER
            value: {{ .Values.controlplane.postgresql.auth.username }}
{{- if .Values.extraVars }}
{{ toYaml .Values.extraVars | indent 10 }}
{{- end }}
        ports:
        {{- if .Values.metrics.enabled }}
          - name: monitoring
            containerPort: {{ .Values.metrics.port }}
        {{- end }}
          - name: control
            containerPort: {{ .Values.config.control.port }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
      {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.readinessProbe.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        {{- end }}


