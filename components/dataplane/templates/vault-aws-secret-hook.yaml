{{- $seedConfig := .Values.config.vault.seedAwsSecret -}}
{{- if $seedConfig.enabled }}
{{- $secretConfig := $seedConfig.credentials.secret -}}
{{- $existingSecretName := $secretConfig.name | default "" -}}
{{- $managedSecretName := $secretConfig.name | default (printf "%s-aws-s3-credentials" (include "app.chartname" .)) -}}
{{- $resolvedSecretName := ternary $managedSecretName $existingSecretName $secretConfig.create -}}
{{- $existingSecret := dict -}}
{{- if and (not $secretConfig.create) (ne $existingSecretName "") }}
{{- $existingSecret = lookup "v1" "Secret" .Release.Namespace $existingSecretName -}}
{{- if not $existingSecret }}
{{- fail (printf "config.vault.seedAwsSecret.credentials.secret.name references missing Secret %q in namespace %q" $existingSecretName .Release.Namespace) }}
{{- end }}
{{- end }}
{{- $inlineAccessKeyId := $seedConfig.credentials.inline.accessKeyId | default "" -}}
{{- $inlineSecretAccessKey := $seedConfig.credentials.inline.secretAccessKey | default "" -}}
{{- /* No hard fail — if no credentials are configured the Job is still created but exits gracefully.
     Vault seeding can be done manually later via: kubectl exec <vault-pod> -- vault kv put secret/aws-cred content='{...}' */}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.chartname" . }}-vault-aws-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      {{- end }}
      containers:
        - name: vault-aws-seed
          image: "{{ $seedConfig.hookImage.repository }}:{{ $seedConfig.hookImage.tag }}"
          imagePullPolicy: {{ $seedConfig.hookImage.pullPolicy | quote }}
          env:
            - name: VAULT_ADDR
              value: {{ .Values.config.vault.url | quote }}
            - name: VAULT_KV_MOUNT_PATH
              value: {{ $seedConfig.kvMountPath | quote }}
            - name: VAULT_SECRET_KEY
              value: {{ $seedConfig.keyName | quote }}
            - name: EDC_SECRET_TOKEN_TYPE
              value: {{ $seedConfig.edcType | quote }}
            {{- if .Values.config.vault.tokenSecretName }}
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.config.vault.tokenSecretName }}
                  key: {{ .Values.config.vault.tokenSecretKey }}
            {{- else }}
            - name: VAULT_TOKEN
              value: {{ .Values.config.vault.token | quote }}
            {{- end }}
            {{- if ne $resolvedSecretName "" }}
            - name: AWS_ACCESS_KEY_ID_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ $resolvedSecretName }}
                  key: {{ $secretConfig.accessKeyIdKey }}
            - name: AWS_SECRET_ACCESS_KEY_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ $resolvedSecretName }}
                  key: {{ $secretConfig.secretAccessKeyKey }}
            - name: AWS_SESSION_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ $resolvedSecretName }}
                  key: {{ $secretConfig.sessionTokenKey }}
                  optional: true
            - name: AWS_EXPIRATION_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ $resolvedSecretName }}
                  key: {{ $secretConfig.expirationKey }}
                  optional: true
            {{- else }}
            - name: AWS_ACCESS_KEY_ID_VALUE
              value: {{ $seedConfig.credentials.inline.accessKeyId | quote }}
            - name: AWS_SECRET_ACCESS_KEY_VALUE
              value: {{ $seedConfig.credentials.inline.secretAccessKey | quote }}
            - name: AWS_SESSION_TOKEN_VALUE
              value: {{ $seedConfig.credentials.inline.sessionToken | quote }}
            - name: AWS_EXPIRATION_VALUE
              value: {{ $seedConfig.credentials.inline.expiration | quote }}
            {{- end }}
          command:
            - python
            - -c
            - |
              import json
              import os
              import sys
              import urllib.error
              import urllib.parse
              import urllib.request

              vault_addr = os.environ["VAULT_ADDR"].rstrip("/")
              vault_token = os.environ.get("VAULT_TOKEN", "")
              mount_path = os.environ["VAULT_KV_MOUNT_PATH"].strip("/")
              secret_key = urllib.parse.quote(os.environ["VAULT_SECRET_KEY"].strip("/"), safe="/")
              access_key_id = os.environ.get("AWS_ACCESS_KEY_ID_VALUE", "")
              secret_access_key = os.environ.get("AWS_SECRET_ACCESS_KEY_VALUE", "")

              if not vault_token:
                  raise SystemExit("VAULT_TOKEN is required when config.vault.seedAwsSecret.enabled is true")
              if not access_key_id or not secret_access_key:
                  # No credentials provided — skip Vault seeding gracefully.
                  # Seed Vault manually later:
                  #   kubectl exec <vault-pod> -n <namespace> -- vault kv put secret/aws-cred \
                  #     content='{"edctype":"dataspaceconnector:secrettoken","accessKeyId":"<key>","secretAccessKey":"<secret>"}'
                  print("WARNING: AWS accessKeyId and/or secretAccessKey are empty — skipping Vault seed. "
                        "Seed Vault manually when credentials are available.")
                  sys.exit(0)

              secret_token = {
                  "edctype": os.environ.get("EDC_SECRET_TOKEN_TYPE", "dataspaceconnector:secrettoken"),
                  "accessKeyId": access_key_id,
                  "secretAccessKey": secret_access_key,
              }

              session_token = os.environ.get("AWS_SESSION_TOKEN_VALUE", "")
              if session_token:
                  secret_token["sessionToken"] = session_token

              expiration = os.environ.get("AWS_EXPIRATION_VALUE", "")
              if expiration:
                  try:
                      secret_token["expiration"] = int(expiration)
                  except ValueError:
                      raise SystemExit("AWS expiration must be an integer epoch value when provided")

              payload = {
                  "data": {
                      "content": json.dumps(secret_token, separators=(",", ":"))
                  }
              }

              request = urllib.request.Request(
                  f"{vault_addr}/v1/{mount_path}/data/{secret_key}",
                  data=json.dumps(payload).encode("utf-8"),
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "X-Vault-Token": vault_token,
                  },
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read().decode("utf-8")
                      print(f"Seeded Vault secret '{os.environ['VAULT_SECRET_KEY']}' via {response.status}")
                      if body:
                          print(body)
              except urllib.error.HTTPError as exc:
                  print(exc.read().decode("utf-8"), file=sys.stderr)
                  raise
{{- end }}
