replicaCount: 1
name: dataplane

image:
  repository: ds4h-registry:5432
  name: edc-dataplane
  tag: latest
  sha: ""
  pullPolicy: Always
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
  - name: EDC_DATA_PLANE_SELF_REGISTRATION
    value: "true"

  - name: WEB_HTTP_PORT
    value: "8182"

  - name: WEB_HTTP_PATH
    value: "/api"

  - name: WEB_HTTP_CONTROL_PORT
    value: "9292"

  - name: WEB_HTTP_CONTROL_PATH
    value: "/api/control"
  
  - name: WEB_HTTP_MANAGEMENT_PORT
    value: "8193"

  - name: WEB_HTTP_MANAGEMENT_PATH
    value: "/api/v1/management"

  - name: WEB_HTTP_PROTOCOL_PORT
    value: "19194"

  - name: WEB_HTTP_PROTOCOL_PATH
    value: "/protocol"

  - name: WEB_HTTP_VERSION_PORT
    value: "19195"

  - name: WEB_HTTP_VERSION_PATH
    value: "/version"

  - name: EDC_RUNTIME_ID
    value: "dataplane"

  - name: EDC_PARTICIPANT_ID
    value: "did:web:localhost%3A8182"


  # should point to the control plane service name and control api port
  - name: EDC_DPF_SELECTOR_URL
    value: "http://edc-controlplane:8093/api/control/v1/dataplanes"

  # should be the same as the service name as the control plane uses it to call the dataplane apis
  - name: EDC_HOSTNAME
    value: "edc-dataplane"

  # TODO: changes when we test the data transfer with real endpoint
  - name: WEB_HTTP_PUBLIC_PORT
    value: "12001"

  - name: WEB_HTTP_PUBLIC_PATH
    value: "/api/public"
  
  - name: EDC_DATAPLANE_PROXY_PUBLIC_ENDPOINT
    value: "http://localhost:12001/api/public"

  - name: EDC_DSP_CALLBACK_ADDRESS
    value: "http://localhost:19194/protocol"
  ##############################

  # TODO changes when we have real keys, dids and identity hub is up and running
  - name: EDC_TRANSFER_PROXY_TOKEN_VERIFIER_PUBLICKEY_ALIAS
    value: "did:web:localhost%3A8182#key-1"

  - name: EDC_TRANSFER_PROXY_TOKEN_SIGNER_PRIVATEKEY_ALIAS
    value: "did:web:localhost%3A8182-alias"
  ##############################

  - name: EDC_SQL_SCHEMA_AUTOCREATE
    value: "true"

  # Add these variables for enabling CORS
  # - name: EDC_WEB_REST_CORS_ORIGINS
  #   #value: "http://dataspace4health.local:8086"
  #   value: "*"
  
  # - name: EDC_WEB_REST_CORS_ENABLED
  #   value: "true"
  
  # - name: EDC_WEB_REST_CORS_HEADERS
  #   value: "Authorization, Content-Type, Origin, Accept, x-api-key"
  
  # - name: EDC_WEB_REST_CORS_METHODS
  #   value: "GET,POST,PUT,DELETE,OPTIONS"  


autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

service:
  control:
    port: 9292

config:
  environment: development
  api:
    basePath: /api
  control:
    host: ""
    port: 9292 #control port

#TODO: check if ingress is needed for dataplane or it is only called by control plane internally.
ingress:
  enabled: true
  hosts:
    - paths:
      - path: /edc-dp
        port: 9292 ## control port
        pathType: Prefix
      
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local

  rewriteTargets:
    - regex: ^/edc-dp/(.*)
      replacement: /api/control/$1 # control api base path
    
## the health check end point is provided by the observability api of EDC
#TODO: readiness probe to be enabled(how?). disabled for now to avoid pod crash loop and be discoverable by control plane
readinessProbe:
  enabled: false
  path: /api/check/health
  port: 8080

secretEnv:

postgresql:
  enabled: true
  auth:
    username: edc_user
    password: "p@ssw0rd"
    database: edc_connector_db
    postgresPassword: "p@ssw0rd"
  primary:
    persistence:
      enabled: true
      size: 5Gi

storage:
  enabled: false