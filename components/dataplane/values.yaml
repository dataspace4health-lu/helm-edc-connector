replicaCount: 1
name: dataplane

image:
  repository: ds4h-registry:5432
  name: edc-dataplane
  tag: "0.0.0"
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
  # should be the same as the service name as the control plane uses it to call the dataplane apis
  # - name: EDC_HOSTNAME
  #   value: "edc-dataplane"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

service:
  http:
    port: 8182 #web http port
  control:
    port: 9292 #control port
  management:
    port: 8193 #control port
  protocol:
    port: 19194 #dsp port
  version:
    port: 19195 #version port
  public:
    port: 12001 #public port

config:
  participantId: "did:web:dataspace4health.local" # DID:WEB identifier of the participant, will be used as runtime participantId
  sqlSchemaAutocreate: true
  dataplaneSelfRegistration: true
  # should point to the control plane service name and control api port
  dataplaneSelectorUrl: "http://dataplane-controlplane:8093/edc/cp/control/api/v1/dataplanes"
  controlplaneReadinessUrl: "http://dataplane-controlplane:8181/edc/cp/base/api/check/health"
  stsPrivateKeyAlias: "key-1"
  stsPublicKeyAlias: "key-1"
  http:
    host: ""
    port: 8182 #web http port
    path: "/edc/dp/base/api"
  control:
    host: ""
    port: 9292 #control port
    path: "/edc/dp/control/api"
  management:
    host: ""
    port: 8193 #control port
    path: "/edc/dp/management/api"
  protocol:
    host: ""
    port: 19194
    path: "/edc/dp/dsp/api"
  version:
    host: ""
    port: 19195
    path: "/edc/dp/version/api"
  public:
    host: ""
    port: 12001
    path: "/edc/dp/public/api"

#TODO: check if ingress is needed for dataplane or it is only called by control plane internally.
ingress:
  enabled: true
  hosts:
    - host: dataspace4health.local
      paths:
      - path: "/edc/dp/control/api"
        port: 9292 ## control port
        pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local
    
## the health check end point is provided by the observability api of EDC
readinessProbe:
  enabled: false
  path: /edc/dp/base/api/check/health
  port: 8182

secretEnv:

controlplane:
  enabled: true
  nameOverride: controlplane
  postgresql:
    nameOverride: controlplane-postgresql