# -- Default number of instances to start 
replicaCount: 1
name: controlplane
# -- Ovverwrites application name
# nameOverride: ""

image:
  repository: ds4h-registry:5432
  name: edc-controlplane
  tag: latest
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
  #catalog
  - name: WEB_HTTP_CATALOG_PORT
    value: "8194"
  - name: WEB_HTTP_CATALOG_PATH
    value: "/api/catalog"
  #web
  - name: WEB_HTTP_PORT
    value: "8181"
  - name: WEB_HTTP_PATH
    value: "/api"
  #management
  - name: WEB_HTTP_MANAGEMENT_PORT
    value: "9192"
  - name: WEB_HTTP_MANAGEMENT_PATH
    value: "/api/v1/management"
  #dsp protocol
  - name: WEB_HTTP_PROTOCOL_PORT
    value: "8092"
  - name: WEB_HTTP_PROTOCOL_PATH
    value: "/api/dsp"
  #control
  - name: WEB_HTTP_CONTROL_PORT
    value: "8093"
  - name: WEB_HTTP_CONTROL_PATH
    value: "/api/control"

  - name: EDC_SQL_SCHEMA_AUTOCREATE
    value: "true"
  - name: EDC_PARTICIPANT_ID
    value: "did:web:dataspace4health%3A7093"

  - name: EDC_RUNTIME_ID
    value: "dataspace4health-p1-runtime"


autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

## The web http ports is general-purpose API endpoint that may expose different resources and can be used when we write custom logic which is not part of management API or protocol API
## The management port is used to expose the management API of EDC
service:
  management:
    port: 9192
  dsp:
    port: 8092
  http:
    port: 8181
  control:
    port: 8093

config:
  environment: development
  api:
    basePath: /api
  http:
    host: ""
    port: 8181 #web http port
    timeout:
      idle: 120s
      read: 10s
      write: 10s
  management:
    host: ""
    port: 9192 #management api port
  dsp:
    host: ""
    protocol: dsp
    port: 8092 #dsp port
  control:
    host: ""
    port: 8093 #control port   

redis:
  enabled: false

#TODO: to add ingress for all the exposed apis
ingress:
  enabled: true
  hosts:
    - paths:
      - path: /edc-cp
        port: 9192 ## management port
        pathType: Prefix
      - path: /edc-dsp
        port: 8092 ## dsp port
        pathType: Prefix
      - path: /edc-control
        port: 8093 ## control port
        pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local
  rewriteTargets:
    - regex: ^/edc-cp/(.*)
      replacement: /api/v1/management/v3/$1 # management api base path
    - regex: ^/edc-dsp/(.*)
      replacement: /api/dsp/$1 # dsp api base path
    - regex: ^/edc-control/(.*)
      replacement: /api/control/$1 # control api base path


## the health check end point is provided by the observability api of EDC
readinessProbe:
  enabled: true
  path: /api/check/health
  port: 8080

secretEnv:

postgresql:
  enabled: true
  auth:
    username: edc_user
    password: "p@ssw0rd"
    database: edc_connector_db
    postgresPassword: "p@ssw0rd"
  primary:
    persistence:
      enabled: true
      size: 5Gi

storage:
  enabled: false