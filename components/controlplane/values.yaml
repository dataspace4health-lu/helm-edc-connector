# -- Default number of instances to start 
replicaCount: 1
name: controlplane
# -- Ovverwrites application name
# nameOverride: ""

image:
  repository: ds4h-registry:5432
  name: edc-controlplane
  tag: "0.0.0"
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

podAnnotations: {}

# -- Extra environment variables to set in the deployment
extraVars:
 
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0

## The web http ports is general-purpose API endpoint that may expose different resources and can be used when we write custom logic which is not part of management API or protocol API
## The management port is used to expose the management API of EDC
service:
  http:
    port: 8181
  management:
    port: 9192
  control:
    port: 8093
  protocol:
    port: 8092
  catalog:
    port: 8194

config:
  participantId: "did:web:dataspace4health.local" # DID:WEB identifier of the participant, will be used as runtime participantId
  sqlSchemaAutocreate: true
  policy:
    catalogScope: "org.eclipse.edc.vc.type:MembershipCredential:read" # Scope for catalog policy validation
  http:
    host: ""
    port: 8181 #web http port
    path: "/edc/cp/base/api"
  management:
    host: ""
    port: 9192 #management api port
    path: "/edc/cp/management/api"
  control:
    host: ""
    port: 8093 #control port 
    path: "/edc/cp/control/api"
  protocol:
    host: ""
    port: 8092 #dsp port 
    path: "/edc/cp/dsp/api"
  catalog:
    host: ""
    port: 8194
    path: "/edc/cp/catalog/api"
  vault:
    createSecret: true #-- whether to create the vault token secret (set to false if another component creates it)
    token: "root" #-- vault token (only used when createSecret is true, use external secret for production)
    tokenSecretName: "edc-controlplane-vault" #-- secret name where vault token is stored, if its not provided, assume that vault is not to be used.
    tokenSecretKey: "token"
    url: "http://controlplane-vault:8200" #-- Vault service URL (typically {release-name}-vault) 
    allowFallback: true
  sts:
    oauthTokenUrl: "http://edc-identityhub:8185/edc/ih/sts/api"

  iam:
  # format to add trusted issuers and their supported types
    trustedissuer:
    #   p1:
    #     id: "did:web:dataspace4health.local"
    #     supportedtypes:
    #     - "MembershipCredential"
  dsp:
  #http://edc-controlplane.edc-user1.svc.cluster.local:8092/edc/cp/dsp/api
    callbackAddress: ""
  scope:
    catalog: ""
    contract: ""
    transfer: ""
    
#TODO: to add ingress for all the exposed apis
ingress:
  enabled: true
  hosts:
    - host: dataspace4health.local
      paths:
      - path: /edc/cp/base/api
        port: 8181 ## internal app port for health check
        pathType: Prefix
      - path: /edc/cp/management/api
        port: 9192 ## management port
        pathType: Prefix
      - path: "/edc/cp/dsp/api"
        port: 8092 ## dsp port
        pathType: Prefix
      - path: "/edc/cp/control/api"
        port: 8093 ## control port
        pathType: Prefix
      - path: "/edc/cp/catalog/api"
        port: 8194 ## catalog port
        pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local

## the health check end point is provided by the observability api of EDC
readinessProbe:
  enabled: true
  path: /edc/cp/base/api/check/health
  port: 8181

secretEnv:

postgresql:
  enabled: true
  image:
    registry: bitnamilegacy
    repository: postgresql
    tag: 16.2.0-debian-12-r8
  auth:
    username: edc_user
    password: "p@ssw0rd"
    database: edc_connector_db
    postgresPassword: "p@ssw0rd"
  primary:
    persistence:
      enabled: true
      size: 5Gi
      path: "/mnt/data/controlplane-postgres"

storage:
  enabled: true
vault:
  enabled: false