# -- Default number of instances to start 
replicaCount: 1
name: edc-controlplane
# -- Ovverwrites application name
# nameOverride: ""

image:
  repository: ds4h-registry:5432
  name: edc-controlplane
  tag: latest
  # -- Image sha, usually generated by the CI
  # Uses image.tag if empty
  sha: ""
  pullPolicy: Always
  # -- Image pull secret when internal image is used
  pullSecrets:

## Use configMap or secretRef for environment variables
# useConfigMap: false
# configMapName: my-configmap
# useSecretRef: false
# secretRefName: my-secret

podAnnotations: {}

# extraVars:
# - name: EXTRA_VAR_1
#   value: extra-var-value-1


## Configure pod autoscaling
## TODO change autoscaling based on participants number
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 3
  # -- CPU target for autoscaling trigger
  targetCPUUtilizationPercentage: 70
  # -- Memory target for autoscaling trigger
  targetMemoryUtilizationPercentage: 70

## Prometheus Exporter/Metrics enable/disable and Port for prometheus metrics
metrics:
  enabled: false
  port: 2112

log:
  level: "debug"
  encoding: json    

##
## Kubernetes [SecurityContext](https://kubernetes.io/docs/tasks/configure-pod-container/security-context/) object.
##

security:
  # -- by default, apps run as non-root
  runAsNonRoot: false
  # -- User used by the apps
  runAsUid: 0
  # -- Group used by the apps
  runAsGid: 0
##
##
service:
  management:
    port: 9191
  dsp:
    port: 8092
  http:
    port: 8181

config:
  environment: development
  api:
    basePath: /api
  http:
    host: ""
    port: 8181 #web http port
    timeout:
      idle: 120s
      read: 10s
      write: 10s
  management:
    host: ""
    port: 9191 #management api port
  dsp:
    host: ""
    protocol: dsp
    port: 8092 #dsp port

redis:
  enabled: false

ingress:
  enabled: true
  hosts:
    - paths:
      - path: /edc-cp
        port: 9191
        pathType: Prefix
  tls:
    - secretName: dataspace4health.local
      hosts:
        - dataspace4health.local
  rewriteTarget:
    regex: ^/edc-cp/(.*)
    replacement: /$1

## the health check end point is provided by the observability api of EDC
readinessProbe:
  enabled: true
  path: /api/check/health
  port: 8080

secretEnv:

postgresql:
  enabled: true
  auth:
    username: edc_user
    password: "p@ssw0rd"
    database: edc_connector_db
    postgresPassword: "p@ssw0rd"
  primary:
    persistence:
      enabled: true
      size: 5Gi

storage:
  enabled: false