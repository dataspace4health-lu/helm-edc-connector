apiVersion: v1
kind: Service
metadata:
  name: {{ template "app.chartname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
  - name: http
    targetPort: {{ .Values.config.http.port }}
    port: {{ .Values.service.http.port }}
  - name: management
    targetPort: {{ .Values.config.management.port }}
    port: {{ .Values.service.management.port }}
  - name: protocol
    targetPort: {{ .Values.config.protocol.port }}
    port: {{ .Values.service.protocol.port }}
  - name: control
    targetPort: {{ .Values.config.control.port }}
    port: {{ .Values.service.control.port }}
  - name: catalog
    targetPort: {{ .Values.config.catalog.port }}
    port: {{ .Values.service.catalog.port }}
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
