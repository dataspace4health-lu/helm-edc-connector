{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "app.chartname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- $middlewares := list }}
    {{- if .Values.ingress.rewriteTargets }}
      {{- range $i, $target := .Values.ingress.rewriteTargets }}
        {{- $mwName := printf "%s-%s-replacepathregex-%d@kubernetescrd" $.Release.Namespace (include "app.chartname" $) $i }}
        {{- $middlewares = append $middlewares $mwName }}
      {{- end }}
    {{- end }}
    {{- if .Values.ingress.cors }}
      {{- $mwName := printf "%s-%s-cors@kubernetescrd" $.Release.Namespace (include "app.chartname" $)}}
      {{- $middlewares = append $middlewares $mwName }}
    {{- end }}
    {{- if $middlewares }}
      traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $middlewares }}
    {{- end }}
    {{- if .Values.ingress.annotations }}
{{ toYaml .Values.ingress.annotations | indent 4 }}
    {{- end }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    
spec:
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}

  rules:
  {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType}}
            backend:
              service:
                name: {{ template "app.chartname" $ }}
                port:
                  number: {{ .port }}
        {{- end }}
  {{- end }}
{{- end }}