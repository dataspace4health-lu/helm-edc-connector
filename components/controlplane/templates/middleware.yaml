{{- if .Values.ingress.rewriteTargets }}
{{- range $i, $target := .Values.ingress.rewriteTargets }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "app.chartname" $ }}-replacepathregex-{{ $i }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  replacePathRegex:
    regex: {{ $target.regex }}
    replacement: {{ $target.replacement }}
---
{{- end }}
{{- end }}
---
#TODO: to make this generic to support multiple CORS origins, headers and methods
#TODO: do we really need it?
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "app.chartname" $ }}-cors
  namespace: {{ $.Release.Namespace }}
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
      - Origin
      - Accept
      - x-api-key
    accessControlAllowOriginList:
      - "*"
    accessControlMaxAge: 100
    addVaryHeader: true
