#deployment for control plane(an EDC component)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ template "app.chartname" . }}"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ include "app.revision" . }}
    app.kubernetes.io/part-of: rse
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        {{- include "app.metricsAnnotations" . | nindent 8 }}
{{- if .Values.podAnnotations }}
{{ toYaml .Values.podAnnotations | indent 8 }}
{{- end }}
    spec:
      securityContext:
{{- include "app.securitycontext" . | nindent 8 }}
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      {{- end }}
      containers:
      - name: {{ template "app.chartname" . }}
        image: "{{ .Values.image.repository }}/{{ .Values.image.name }}:{{ default .Chart.AppVersion .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        securityContext:
            readOnlyRootFilesystem: true
        env:
          - name: EDC_PARTICIPANT_ID 
            value: "{{ .Values.config.participantId }}"
          - name: EDC_SQL_SCHEMA_AUTOCREATE
            value: "{{ .Values.config.sqlSchemaAutocreate | default "true" }}"
          - name: WEB_HTTP_PORT
            value: "{{ .Values.config.http.port }}"
          - name: WEB_HTTP_PATH
            value: "{{ .Values.config.http.path }}"
          - name: WEB_HTTP_MANAGEMENT_PORT
            value: "{{ .Values.config.management.port }}"
          - name: WEB_HTTP_MANAGEMENT_PATH
            value: "{{ .Values.config.management.path }}"
          - name: WEB_HTTP_CONTROL_PORT
            value: "{{ .Values.config.control.port }}"
          - name: WEB_HTTP_CONTROL_PATH
            value: "{{ .Values.config.control.path }}"
          - name: WEB_HTTP_PROTOCOL_PORT
            value: "{{ .Values.config.protocol.port }}"
          - name: WEB_HTTP_PROTOCOL_PATH
            value: "{{ .Values.config.protocol.path }}"
          - name: WEB_HTTP_CATALOG_PORT
            value: "{{ .Values.config.catalog.port }}"
          - name: WEB_HTTP_CATALOG_PATH
            value: "{{ .Values.config.catalog.path }}"
          # TODO: Shoudl be auto renew, how to handle the auto renew in secret?
          - name: EDC_VAULT_HASHICORP_URL
            value: "{{ .Values.config.vault.url }}"
          # TODO: Shoudl be auto renew, how to handle the auto renew in secret?
        {{- if .Values.config.vault.tokenSecretName }}
          - name: EDC_VAULT_HASHICORP_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ .Values.config.vault.tokenSecretName }}
                key: {{ .Values.config.vault.tokenSecretKey }}
        {{- end }}
          - name : EDC_IAM_STS_OAUTH_TOKEN_URL
            value: "{{ .Values.config.sts.oauthTokenUrl }}"
          - name : EDC_IAM_STS_OAUTH_CLIENT_ID
            value: "{{ .Values.config.sts.oauthClientId }}"
          - name : EDC_IAM_STS_OAUTH_CLIENT_SECRET_ALIAS
            value: "{{ .Values.config.sts.oauthClientSecretAlias }}"
            ## TODO: Move STS keys to vault
          - name : EDC_IAM_STS_PRIVATEKEY_ALIAS
            value: "{{ .Values.config.sts.privateKeyAlias }}"
          - name : EDC_IAM_STS_PUBLICKEY_ID
            value: "{{ .Values.config.sts.publicKeyId }}"
          - name : EDC_IAM_ISSUER_ID
            value: "{{ .Values.config.issuerId }}"
          - name: LOG_LEVEL
            value: "{{ .Values.log.level | default "INFO" }}"

        {{- if .Values.secretEnv }}
        {{- range $key, $value := .Values.secretEnv }}
          - name: "{{ $key }}"
            valueFrom:
              secretKeyRef:
                name: "{{ $value.name }}"
                key: "{{ $value.key }}"
        {{- end }}
        {{- end }}
        {{- if .Values.postgresql.enabled }}
          - name: EDC_DATASOURCE_DEFAULT_URL
            value: jdbc:postgresql://{{ include "app.chartname" . }}-postgresql-hl.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgresql.auth.database }}
        {{- else }}
          - name: EDC_DATASOURCE_DEFAULT_URL
            value: {{ .Values.postgresql.url }}
        {{- end }}
          - name: EDC_DATASOURCE_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "app.chartname" . }}-postgresql
                key: password
          - name: EDC_DATASOURCE_DEFAULT_USER
            value: {{ .Values.postgresql.auth.username }}
{{- if .Values.extraVars }}
{{ toYaml .Values.extraVars | indent 10 }}
{{- end }}
        ports:
        {{- if .Values.metrics.enabled }}
          - name: monitoring
            containerPort: {{ .Values.metrics.port }}
        {{- end }}
          - name: http
            containerPort: {{ .Values.config.http.port }}
          - name: management
            containerPort: {{ .Values.config.management.port }}
          - name: control
            containerPort: {{ .Values.config.control.port }}
          - name: protocol
            containerPort: {{ .Values.config.protocol.port }}
          - name: catalog
            containerPort: {{ .Values.config.catalog.port }}
        resources:
{{ toYaml .Values.resources | indent 10 }}

        readinessProbe:
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ .Values.config.http.port }}
          initialDelaySeconds: 5
          periodSeconds: 5

