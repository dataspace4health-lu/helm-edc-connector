# =============================================================================
# helm-edc-connector/vault-values.yaml
# =============================================================================
# This overlay ENABLES the embedded HashiCorp Vault sub-chart for
# standalone / CI use (e.g. `helm install edc helm/*.tgz -f vault-values.yaml`).
#
# vault.enabled: true  → deploys vault in dev mode alongside the connector.
#                         Suitable for testing and CI pipelines.
#                         NOT suitable for production (in-memory, loses secrets on restart).
#
# For PRODUCTION use, keep vault.enabled: false here and deploy the standalone
# helm-edc-hashicorp-vault chart separately.
# See helm-edc-hashicorp-vault/README.md for the full setup workflow.
# =============================================================================
vault:
  enabled: true   # deploy embedded vault for helm-edc-connector standalone/CI use
  global:
    openshift: true
  server:
    authDelegator:
      enabled: false
    podSpec:
      hostUsers: false
    securityContext:
      runAsNonRoot: true
#     podSecurityContext:
# -      fsGroup: null
    dev:
      enabled: true
      devRootToken: "root"   # change for anything beyond local/dev
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    dataStorage:
      enabled: true
      size: 1Gi

  injector:
    enabled: false
