controlplane:
  nameOverride: controlplane
  postgresql:
    nameOverride: controlplane-postgresql
  config:
    participantId: "did:web:dataspace4health.local"
    vault:
      createSecret: false #-- whether to create the vault token secret (set to false if another component creates it)
      token: "root" #-- vault token (only used when createSecret is true)
      tokenSecretName: "edc-vault" #-- Use the same secret as identityhub
      tokenSecretKey: "token"
      url: "http://edc-vault:8200" #-- Vault service URL (release-name + '-vault') 
dataplane:
  nameOverride: dataplane
  config:
    participantId: "did:web:dataspace4health.local"
    dataplaneSelfRegistration: true
    dataplaneSelectorUrl: "http://edc-controlplane:8093/edc/cp/control/api/v1/dataplanes"
    controlplaneReadinessUrl: "http://edc-controlplane:8181/edc/cp/base/api/check/health"
    stsPrivateKeyAlias: "key-1"
    stsPublicKeyAlias: "key-1"
    vault:
      createSecret: false #-- whether to create the vault token secret (set to false if another component creates it)
      token: "root" #-- vault token (only used when createSecret is true)
      tokenSecretName: "edc-vault" #-- Use the same secret as identityhub
      tokenSecretKey: "token"
      url: "http://edc-vault:8200" #-- Vault service URL (release-name + '-vault') 
      seedAwsSecret:
        enabled: false #-- optional Helm hook that writes an AWS SecretToken JSON into Vault for AmazonS3 keyName usage
        kvMountPath: "secret"
        keyName: "aws-cred"
        credentials:
          secret:
            create: false #-- when true, the chart creates a Kubernetes Secret from the inline values below
            name: "" #-- when create is false, reference an existing Kubernetes Secret here
            accessKeyIdKey: "accessKeyId"
            secretAccessKeyKey: "secretAccessKey"
            sessionTokenKey: "sessionToken"
            expirationKey: "expiration"
          inline:
            accessKeyId: "" #-- used to create the chart-managed Kubernetes Secret, or as a direct fallback when no secret name is configured
            secretAccessKey: ""
            sessionToken: ""
            expiration: ""
  controlplane:
    enabled: false
    postgresql:
      enabled: false  # Disable PostgreSQL when controlplane is disabled
      auth:
        password: "p@ssw0rd"
identityhub:
  nameOverride: identityhub
  postgresql:
    nameOverride: identityhub-postgresql
  config:
    identityHubIamId: "default"
    identityHubIamPublicKeyAlias: "default-key"
    vault:
      createSecret: true
      token: "root" #-- vault token (only used when createSecret is true)
      tokenSecretName: "edc-vault"
      tokenSecretKey: "token"
      url: "http://edc-vault:8200" #-- Vault service URL (release-name + '-vault') 
dashboard:
  nameOverride: dashboard
  controlplane:
    enabled: false
  config:
    connectorName: "Data Holder"
    managementUrl: "https://dataspace4health.local/edc/cp/management/api" # should point to control plane management api
    defaultUrl: "https://dataspace4health.local/edc/cp/base/api" # should point to api
    protocolUrl: "https://dataspace4health.local/edc/cp/dsp/api" # should point to control plane dsp api
    federatedCatalogEnabled: "false"
    federatedCatalogUrl: "https://dataspace4health.local/edc/cp/catalog/api" # should point to the federator's federated catalog api
    did: "did:web:dataspace4health.local"
  ## Keycloak authentication — redirects unauthenticated users to Keycloak for login
  keycloak:
    enabled: true
    url: "https://dataspace4health.local/iam"
    realm: "edc-dashboard-local"
    clientId: "edc-dashboard"
  ## Keycloak realm import — imports the edc-dashboard-local realm into the
  ## Keycloak instance deployed by helm-edc-mdc/dca-metadata-capture.
  ## Set enabled: true only when helm-edc-mdc is already deployed and Keycloak is running.
  keycloakImport:
    enabled: false
    createRealmConfigMap: true
    ## Internal Kubernetes URL of the Keycloak service
    ## Adjust the namespace to match where helm-edc-mdc is deployed
    keycloakInternalUrl: "http://dca-metadata-capture-keycloak.default.svc.cluster.local:80/iam"
    adminUser: "admin"
    adminPasswordSecretName: "dca-metadata-capture-keycloak"
    adminPasswordSecretKey: "admin-password"
    image:
      tag: "26.3.3-debian-12-r0"
vault:
  enabled: false
