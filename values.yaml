controlplane:
  nameOverride: controlplane
  postgresql:
    nameOverride: controlplane-postgresql
  config:
    participantId: "did:web:dataspace4health.local"
    vault:
      createSecret: false #-- whether to create the vault token secret (set to false if another component creates it)
      token: "root" #-- vault token (only used when createSecret is true)
      tokenSecretName: "edc-vault" #-- Use the same secret as identityhub
      tokenSecretKey: "token"
      url: "http://edc-vault:8200" #-- Vault service URL (release-name + '-vault') 
dataplane:
  nameOverride: dataplane
  config:
    participantId: "did:web:dataspace4health.local"
    dataplaneSelfRegistration: true
    dataplaneSelectorUrl: "http://edc-controlplane:8093/edc/cp/control/api/v1/dataplanes"
    controlplaneReadinessUrl: "http://edc-controlplane:8181/edc/cp/base/api/check/health"
    stsPrivateKeyAlias: "key-1"
    stsPublicKeyAlias: "key-1"
    vault:
      createSecret: false #-- whether to create the vault token secret (set to false if another component creates it)
      token: "root" #-- vault token (only used when createSecret is true)
      tokenSecretName: "edc-vault" #-- Use the same secret as identityhub
      tokenSecretKey: "token"
      url: "http://edc-vault:8200" #-- Vault service URL (release-name + '-vault') 
      seedAwsSecret:
        enabled: false #-- optional Helm hook that writes an AWS SecretToken JSON into Vault for AmazonS3 keyName usage
        kvMountPath: "secret"
        keyName: "aws-cred"
        credentials:
          secret:
            create: false #-- when true, the chart creates a Kubernetes Secret from the inline values below
            name: "" #-- when create is false, reference an existing Kubernetes Secret here
            accessKeyIdKey: "accessKeyId"
            secretAccessKeyKey: "secretAccessKey"
            sessionTokenKey: "sessionToken"
            expirationKey: "expiration"
          inline:
            accessKeyId: "" #-- used to create the chart-managed Kubernetes Secret, or as a direct fallback when no secret name is configured
            secretAccessKey: ""
            sessionToken: ""
            expiration: ""
  controlplane:
    enabled: false
    postgresql:
      enabled: false  # Disable PostgreSQL when controlplane is disabled
      auth:
        password: "p@ssw0rd"
identityhub:
  nameOverride: identityhub
  postgresql:
    nameOverride: identityhub-postgresql
  config:
    identityHubIamId: "default"
    identityHubIamPublicKeyAlias: "default-key"
    vault:
      createSecret: true
      token: "root" #-- vault token (only used when createSecret is true)
      tokenSecretName: "edc-vault"
      tokenSecretKey: "token"
      url: "http://edc-vault:8200" #-- Vault service URL (release-name + '-vault') 
dashboard:
  nameOverride: dashboard
  controlplane:
    enabled: false
  config:
    connectorName: "Data Holder"
    managementUrl: "https://dataspace4health.local/edc/cp/management/api" # should point to control plane management api
    defaultUrl: "https://dataspace4health.local/edc/cp/base/api" # should point to api
    protocolUrl: "https://dataspace4health.local/edc/cp/dsp/api" # should point to control plane dsp api
    federatedCatalogEnabled: "false"
    federatedCatalogUrl: "https://dataspace4health.local/edc/cp/catalog/api" # should point to the federator's federated catalog api
    did: "did:web:dataspace4health.local"
  ## Keycloak authentication — redirects unauthenticated users to Keycloak for login.
  ## Set enabled: false when no Keycloak instance is available (disables auth entirely).
  ## Three supported scenarios:
  ##   1. No auth:        keycloak.enabled=false  + dashboard.keycloak.enabled=false
  ##   2. Standalone KC:  keycloak.enabled=true   + dashboard.keycloak.enabled=true  + dashboard.keycloakImport.enabled=true
  ##                      (keycloakImport.keycloakInternalUrl → local Keycloak, e.g. http://<release>-keycloak.<ns>.svc.cluster.local:80/iam)
  ##   3. Shared MDC KC:  keycloak.enabled=false  + dashboard.keycloak.enabled=true  + dashboard.keycloakImport.enabled=true
  ##                      (keycloakImport.keycloakInternalUrl → MDC Keycloak, e.g. http://dca-metadata-capture-keycloak.<ns>.svc.cluster.local:80/iam)
  keycloak:
    enabled: true
    url: "https://dataspace4health.local/iam"
    realm: "dca-metadata-capture-local"
    clientId: "edc-dashboard"
  ## Keycloak realm import — imports the edc-dashboard-local realm into whichever
  ## Keycloak instance is running (standalone or MDC-shared).
  ## Set enabled: true whenever dashboard.keycloak.enabled is true and a Keycloak is available.
  keycloakImport:
    enabled: false
    createRealmConfigMap: true
    ## Internal Kubernetes URL of the target Keycloak service.
    ## - Standalone (keycloak.enabled=true): "http://<release-name>-keycloak.<namespace>.svc.cluster.local:80/iam"
    ##   e.g. "http://edc-connector-keycloak.default.svc.cluster.local:80/iam"
    ## - Shared MDC Keycloak:               "http://dca-metadata-capture-keycloak.<namespace>.svc.cluster.local:80/iam"
    keycloakInternalUrl: "http://edc-keycloak.default.svc.cluster.local:80/iam"
    adminUser: "admin"
    ## Secret containing the Keycloak admin password.
    ## - Standalone: "<release-name>-keycloak"  (e.g. "edc-connector-keycloak")
    ## - MDC shared: "dca-metadata-capture-keycloak"
    adminPasswordSecretName: "edc-keycloak"
    adminPasswordSecretKey: "admin-password"
    image:
      tag: "26.3.3-debian-12-r0"
## Keycloak (optional) — deploy a standalone Keycloak instance alongside the connector.
## Enable ONLY when helm-edc-mdc is NOT deployed in the same namespace.
## When helm-edc-mdc is already deployed, leave this disabled and use
## dashboard.keycloakImport to import the edc-dashboard-local realm into MDC's Keycloak.
keycloak:
  enabled: false   # set to true ONLY when deploying without helm-edc-mdc
  image:
    registry: bitnamilegacy
    repository: keycloak
    tag: 26.3.3-debian-12-r0
  auth:
    adminUser: admin
    ## IMPORTANT: set a strong password here and keep it consistent across upgrades.
    ## The Bitnami PostgreSQL sub-chart initializes its data directory with this
    ## password on the FIRST install. Changing it on subsequent upgrades will cause
    ## a mismatch between the stored DB data and the new secret, leading to
    ## Keycloak CrashLoopBackOff. Always use the same password you used on first install.
    adminPassword: "xfsc4Ntt!"
  ## Serve Keycloak under the /iam/ subpath (matches the dashboard keycloak.url)
  httpRelativePath: "/iam/"
  proxy: edge
  production: false
  extraEnvVars:
    - name: PROXY_ADDRESS_FORWARDING
      value: "true"
    - name: KC_HOSTNAME
      value: "https://dataspace4health.local/iam"
    - name: KC_HOSTNAME_STRICT
      value: "false"
  logging:
    level: "INFO"
  ingress:
    enabled: true
    hostname: dataspace4health.local
    annotations:
      kubernetes.io/ingress.class: traefik
    tls: true
    extraTls:
      - hosts:
          - dataspace4health.local
        secretName: dataspace4health.local
  postgresql:
    enabled: true
    nameOverride: keycloak-postgresql
    image:
      registry: bitnamilegacy
      repository: postgresql
      tag: 16.2.0-debian-12-r8
    auth:
      database: keycloak
      username: keycloak
      ## Must match adminPassword above and must never change after the first install.
      password: "xfsc4Ntt!"
      postgresPassword: "xfsc4Ntt!"
    primary:
      persistence:
        size: 5Gi
  global:
    security:
      allowInsecureImages: true

vault:
  enabled: false
